<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture University — Assistant Professor of Sociology — Application</title>
</head>
<body>
<h1>Assistant Professor of Sociology</h1>
<p>Fixture University — Department of Sociology — Application for Employment</p>
<form id="app" action="javascript:void(0)">
  <div>
    <label for="fname">First Name</label>
    <input type="text" id="fname" name="first_name">
  </div>
  <div>
    <label for="lname">Last Name</label>
    <input type="text" id="lname" name="last_name">
  </div>
  <div>
    <label for="email">Email Address</label>
    <input type="email" id="email" name="applicant_email" autocomplete="email">
  </div>
  <div>
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone">
  </div>
  <div>
    <label for="addr">Street Address</label>
    <input type="text" id="addr" name="street">
  </div>
  <div>
    <label for="city">City</label>
    <input type="text" id="city" name="city">
  </div>
  <div>
    <label for="zip">ZIP / Postal Code</label>
    <input type="text" id="zip" name="zip" autocomplete="postal-code">
  </div>
  <div>
    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">Select…</option>
      <option value="CA">Canada</option>
      <option value="US">United States</option>
      <option value="GB">United Kingdom</option>
    </select>
  </div>
  <div>
    <label for="li">LinkedIn Profile URL</label>
    <input type="url" id="li" name="linkedin">
  </div>
  <div>
    <label for="start">Available Start Date</label>
    <input type="text" id="start" name="start_date">
  </div>
  <div>
    <label for="hear">How did you hear about us?</label>
    <input type="text" id="hear" name="referral">
  </div>
  <fieldset>
    <legend>Gender (voluntary)</legend>
    <label><input type="radio" name="gender" value="m"> Man</label>
    <label><input type="radio" name="gender" value="w"> Woman</label>
    <label><input type="radio" name="gender" value="nb"> Non-binary</label>
    <label><input type="radio" name="gender" value="nd"> I do not wish to disclose</label>
  </fieldset>
  <div>
    <label for="cl">Cover Letter (paste text)</label>
    <textarea id="cl" name="cover_letter" rows="8"></textarea>
  </div>
  <div>
    <label for="cvfile">Upload your CV</label>
    <input type="file" id="cvfile" name="cv" accept=".pdf,.txt">
  </div>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
